<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Ordjakten – ett färgglatt läs- och bokstavsspel på svenska i Göteborgs spårvagnsnät. Ljuda korta ord, bygg ord med brickor, läs hållplatsskyltar och samla Göteborgs spårvagnsmodeller.">
<meta name="theme-color" content="#62CDF2">

<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./ikon-192.png" sizes="192x192">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ordjakten">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="application-name" content="Ordjakten">
<title>Ordjakten — Göteborgs spårvagnar</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600..800&family=Lilita+One&family=Nunito:wght@700;800&display=swap">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="world" aria-hidden="true">
  <div class="hill a"></div>
  <div class="hill b"></div>
  <div class="hill c"></div>
</div>
<canvas id="confetti" aria-hidden="true"></canvas>

<div id="app">
  <!-- Gemensam topprad (visas när spelare är vald) -->
  <header id="top-bar" class="top-bar" style="display:none"></header>

  <!-- 1. Välkomst & spelarval -->
  <main>
    <section id="screen-welcome" class="screen"></section>

    <!-- 2. Spårvagnsstart (Göteborgs nät) -->
    <section id="screen-home" class="screen"></section>

    <!-- 3. Resan på Göteborgs spårvagnskarta -->
    <section id="screen-resa" class="screen"></section>

    <!-- 4. Läs- & bokstavsrundan (5 uppgifter per hållplats) -->
    <section id="screen-game" class="screen"></section>
  </main>
</div>

<!-- Delad modal/sheet för Perrongen, Min vagn, Skattkistan, Mina resor, Inställningar & Så går det -->
<div id="sheet-backdrop" class="sheet-backdrop" role="dialog" aria-modal="true" aria-hidden="true">
  <div id="sheet" class="sheet"></div>
</div>

<script type="module" src="./js/app.mjs"></script>
</body>
</html>
